name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 테스트와 빌드에는 Electron 실행 파일이 필요 없음
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      # npm에 올라갈 모양(exports, 타입 선언)이 ESM, CJS 양쪽에서 맞는지 확인함
      - run: yarn workspace @ganimjeong/payment-sdk check:package

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # squash merge 시 PR 제목이 main 커밋 메시지가 되므로 제목 형식을 검사함
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            style
            chore
            ci
            build
          requireScope: false
